<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BJMP NCR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121131;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Back Button Style */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 30px;
        }

        .login-container img {
            height: 90px;
            margin-bottom: 20px;
        }

        .login-container h2 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .login-container h3 {
            color: #555555;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .btn-admin {
            display: block;
            width: 100%;
            background-color: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 12px;
            transition: background-color 0.3s;
            text-align: center;
        }

        .btn-admin:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <img src="bjmp.png" alt="BJMP Logo">
        <h2>SYSTEM LOGIN</h2>
        <h3>RELIGIOUS ACTIVITIES MONITORING SYSTEM</h3>

        <form id="adminLoginForm">
            
            <div class="input-group">
                <label for="login-username">USERNAME</label>
                <input type="text" id="login-username" name="admin" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="login-password">PASSWORD</label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password">
            </div>

            <div id="error-message" class="error-msg"></div>

            <button type="submit" id="submitBtn" class="btn-submit">LOG IN AS ADMIN</button>
            <a href="index.html" class="btn-admin">Back to User Login</a>

        </form>
    </div>

    <!-- JavaScript Handling Authentication and Preventing Redirection on Failure -->
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop default browser reload

            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error-message');

            // Reset error state
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerText = "AUTHENTICATING...";

            try {
                // Calls Netlify serverless function endpoint
                const response = await fetch('/.netlify/functions/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: usernameInput, 
                        password: passwordInput 
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // SUCCESS: Proceed to admin dashboard
                    window.location.href = 'home.html';
                } else {
                    // FAILURE: Wrong user or password -> Display error and STAY on page
                    errorDiv.textContent = result.message || 'Invalid admin username or password.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorDiv.textContent = 'Server connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "LOG IN AS ADMIN";
            }
        });
    </script>
</body>
</html>
