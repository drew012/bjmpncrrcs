<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BJMP NCR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121131;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Back Button Style */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            text-decoration: none;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-top: 30px;
        }

        .login-container img {
            height: 90px;
            margin-bottom: 20px;
        }

        .login-container h2 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .btn-submit {
            width: 100%;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        /* Admin Access Button Style */
        .btn-admin {
            display: block;
            width: 100%;
            background-color: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 12px;
            transition: background-color 0.3s;
            text-align: center;
        }

        .btn-admin:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <!-- Back to Home Button -->
  

    <div class="login-container">
        
        <img src="bjmp.png" alt="BJMP Logo">
        <h2>SYSTEM LOGIN</h2>

        <form action="home.html" method="GET">
            
            <div class="input-group">
                <label for="login-username">USERNAME</label>
                <input type="text" id="login-username" name="username" required>
            </div>

            <div class="input-group">
                <label for="login-password">PASSWORD</label>
                <input type="password" id="login-password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">LOG IN</button>

           
            <a href="adminlogin.html" class="btn-admin">ADMIN ACCESS</a>
        
            <a href="signup.html" class="btn-admin">Sign Up</a>

        </form>
    </div>

</body>
</html>
